<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>익명상담 판정</title><link rel="stylesheet" href="/admin.css"><style>.consult-wrap{padding:32px;max-width:1400px;margin:auto}.consult-toolbar{display:flex;gap:8px;margin:20px 0}.consult-toolbar input{padding:10px;min-width:300px}.consult-table{overflow:auto;background:#fff;border:1px solid #d9e2eb}.consult-table table{width:100%;min-width:1150px;border-collapse:collapse}.consult-table th,.consult-table td{padding:12px;border-bottom:1px solid #e5ebf0;text-align:left;vertical-align:top}.consult-table th{background:#edf3f8}.consult-message{max-width:280px;white-space:pre-wrap;overflow-wrap:anywhere}.consult-actions{display:flex;gap:6px;flex-wrap:wrap}.consult-actions button{padding:8px;border:1px solid #173f68;border-radius:6px;background:#fff;color:#173f68}.consult-actions .approve{background:#173f68;color:#fff}.consult-status{font-weight:700}</style></head><body><aside class="sidebar"><a class="brand" href="/">픽견적 <small>관리자 콘솔</small></a><nav class="side-nav"><span class="nav-label">운영 메뉴</span><a href="/">관리 현황</a><a href="/customers">고객 견적</a><a href="/sellers">판매자 신청</a><a href="/approved-sellers">승인 판매자</a><a href="/subscription-products">구독 상품 업로드</a><a href="/alimtalk">알림톡 상태</a><a class="is-active" href="/anonymous-consultation">익명상담 판정</a></nav></aside><main class="admin-shell"><div class="consult-wrap"><header class="admin-header"><div><p class="eyebrow">Anonymous Consultation</p><h1>익명상담 판정/사례</h1><p class="header-copy">차단된 메시지를 검토하고 승인된 사례에만 제재를 적용합니다.</p></div></header><div class="consult-toolbar"><input id="token" type="password" placeholder="관리자 API 토큰"><button class="primary-btn" id="load">사례 불러오기</button><span id="notice"></span></div><div class="consult-table"><table><thead><tr><th>사례번호</th><th>발생시각</th><th>판매자/지점</th><th>탐지유형</th><th>원문</th><th>사유</th><th>상태</th><th>판정</th></tr></thead><tbody id="rows"><tr><td colspan="8">관리자 토큰을 입력하세요.</td></tr></tbody></table></div></div></main><script>const token=document.querySelector('#token'),rows=document.querySelector('#rows'),notice=document.querySelector('#notice');const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/anonymous-policy-cases',{headers:{'X-Admin-Token':token.value.trim()},cache:'no-store'}),d=await r.json().catch(()=>({}));if(!d.ok){notice.textContent=d.message||'불러오지 못했습니다.';return}notice.textContent=` ${d.rows?.length||0}건`;rows.innerHTML=d.rows?.length?d.rows.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.created_at)}</td><td>${esc(x.seller_id)}<br>${esc(x.branch)}</td><td>${esc(x.detection_type)}</td><td class="consult-message">${esc(x.original_message)}</td><td class="consult-message">${esc(x.reason)}<br><small>${esc(x.normalized_message)}</small></td><td class="consult-status">${esc(x.status)}<br>${esc(x.follow_up_action)}</td><td><div class="consult-actions"><button data-id="${esc(x.id)}" data-decision="NOT_VIOLATION">판정 불인정</button><button data-id="${esc(x.id)}" data-decision="ADDITIONAL_REVIEW">추가 검토</button><button class="approve" data-id="${esc(x.id)}" data-decision="APPROVED">판정 승인</button></div></td></tr>`).join(''):'<tr><td colspan="8">사례가 없습니다.</td></tr>'}document.querySelector('#load').onclick=load;rows.onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;const memo=prompt('판정 메모(선택)')||'';const r=await fetch('/api/anonymous-policy-cases/'+encodeURIComponent(b.dataset.id),{method:'PATCH',headers:{'X-Admin-Token':token.value.trim(),'Content-Type':'application/json'},body:JSON.stringify({decision:b.dataset.decision,memo})}),d=await r.json().catch(()=>({}));notice.textContent=d.ok?'저장했습니다.':(d.message||'저장 실패');if(d.ok)load()};</script></body></html>
