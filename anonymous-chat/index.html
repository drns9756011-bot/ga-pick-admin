<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>익명상담 채팅 관리</title>
    <link rel="stylesheet" href="/admin.css?v=20260823-operations-console-v1" />
  <style>
    .chat-admin-wrap { max-width: 1440px; margin: 0 auto; padding: 28px; }
    .chat-admin-grid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 18px; }
    .chat-admin-list, .chat-admin-room { background: #fff; border: 1px solid #d9e2eb; border-radius: 10px; overflow: hidden; }
    .chat-room-button { display: block; width: 100%; padding: 15px; border: 0; border-bottom: 1px solid #edf1f5; background: #fff; text-align: left; cursor: pointer; color: #14283c; }
    .chat-room-button.is-active { background: #edf4fb; }
    .chat-room-button strong, .chat-room-button small { display: block; }
    .chat-room-button small { margin-top: 5px; color: #637487; }
    .chat-room-head { padding: 18px 20px; border-bottom: 1px solid #e5ebf0; }
    .chat-messages { min-height: 430px; max-height: 620px; overflow: auto; padding: 20px; background: #f5f8fb; }
    .chat-message { max-width: 72%; margin: 0 0 12px; padding: 11px 13px; border-radius: 10px; background: #fff; border: 1px solid #dbe4ec; white-space: pre-wrap; overflow-wrap: anywhere; }
    .chat-message.seller { margin-left: auto; background: #eaf2fb; border-color: #c5d9ec; }
    .chat-message small { display: block; margin-bottom: 5px; color: #687b8e; font-size: 11px; }
    @media (max-width: 760px) { .chat-admin-grid { grid-template-columns: 1fr; } .chat-messages { min-height: 360px; } }
  </style>
<link rel="stylesheet" href="/admin-workspace.css?v=20261007-workbench" />
<script defer src="/vendor/admin-icon-nodes.js?v=20261007-workbench"></script>

<link rel="preload" href="/assets/suit-variable.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body class="ops-console">

          <small>관리자 콘솔</small>
        </span>

            <nav class="side-nav" aria-label="관리자 메뉴">

  <main class="admin-shell"><div class="chat-admin-wrap">
    <header class="admin-header"><div><h1>채팅 관리</h1></div><div class="admin-actions"><button class="ghost-btn" id="adminAuthBtn" type="button">관리자 인증</button><button class="primary-btn" id="refresh" type="button">새로고침</button></div></header>
    <div class="chat-admin-grid"><section class="chat-admin-list"><div class="ops-chat-search"><input id="chatSearch" type="search" aria-label="채팅방 검색" placeholder="고객명, 견적번호 검색" /><span id="roomCount" aria-live="polite"></span></div><div id="rooms"></div></section><section class="chat-admin-room" id="room"><div class="chat-room-head">채팅방을 선택하세요.</div><div class="chat-messages" aria-live="polite"></div></section></div>
  </div></main>
  <dialog class="ops-auth-dialog" id="chatAuthDialog" aria-labelledby="chatAuthTitle"><form id="chatAuthForm"><h2 id="chatAuthTitle">관리자 인증</h2><label for="chatAuthToken">관리자 API 토큰</label><input id="chatAuthToken" type="password" autocomplete="off" required /><div class="modal-actions"><button class="ghost-btn" id="cancelChatAuth" type="button">취소</button><button class="primary-btn" type="submit">인증</button></div></form></dialog>
  <script src="/anonymous-chat/chat-admin.js?v=20261007-workbench"></script>
